AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Punarnava - repair-first circular economy for India (Environmental Hacks 2026, Waste and Energy).
  Amplify Hosting, Cognito, API Gateway, Lambda, DynamoDB, S3, Step Functions, EventBridge (+ Scheduler),
  SQS, SNS, SageMaker AI (optional endpoint) and CloudWatch.

Parameters:
  DemoMode:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Shortens reminder (2 min), 30-day follow-up (5 min) and owner timeout (15 min) for the demo video.
  EnableSms:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Send owner SMS through SNS. Indian numbers need DLT registration and the SNS SMS sandbox lifted.
  SageMakerEndpoint:
    Type: String
    Default: ''
    Description: Optional Random Cut Forest endpoint name created by scripts/train_rcf.py. Empty = robust z-score fallback.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to the alerts topic (confirm the subscription email).
  EnableCloudSpeech:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Cloud read-aloud (Amazon Polly, English and Hindi) and voice typing (Amazon Transcribe, all five languages) when the phone's own voices are missing. 'false' = browser voices only.

Conditions:
  IsDemo: !Equals [!Ref DemoMode, 'true']
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]
  SpeechOn: !Equals [!Ref EnableCloudSpeech, 'true']

Globals:
  Function:
    Runtime: nodejs22.x # nodejs20.x was deprecated on 30 Apr 2026
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 29
    CodeUri: ../backend/
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        BUCKET: !Ref PhotoBucket
        BUS: !Ref EventBus
        TOPIC_ARN: !Ref AlertsTopic
        DEMO_MODE: !Ref DemoMode
        ENABLE_SMS: !Ref EnableSms
        REMINDER_MINUTES: '2'
        FOLLOWUP_MINUTES: '5'
        APP_URL: !Sub 'https://main.${AmplifyApp.DefaultDomain}'
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ───────────── Hosting ─────────────
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: punarnava
      Description: Punarnava web app (static, deployed by scripts/deploy-frontend.sh)

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      Stage: PRODUCTION

  # ───────────── Data ─────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema: [{ AttributeName: GSI1PK, KeyType: HASH }, { AttributeName: GSI1SK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema: [{ AttributeName: GSI2PK, KeyType: HASH }, { AttributeName: GSI2SK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      # Rows with a numeric `ttl` (epoch seconds) are removed by DynamoDB: speech rate counters and voice-typing jobs.
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: [!Sub 'https://main.${AmplifyApp.DefaultDomain}', 'http://localhost:8080']
            AllowedHeaders: ['*']
            MaxAge: 3000
      # uploads/ (photos, voice notes) is kept. Only the speech prefixes expire.
      LifecycleConfiguration:
        Rules:
          - { Id: tts-cache, Status: Enabled, Prefix: tts/, ExpirationInDays: 90 }
          - { Id: voice-typing-clips, Status: Enabled, Prefix: uploads/tmp/, ExpirationInDays: 1 }
          - { Id: transcripts, Status: Enabled, Prefix: stt-out/, ExpirationInDays: 1 } # unused today (Transcribe keeps results in its own bucket); a safety net

  # ───────────── Auth ─────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: punarnava-users
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }
        - { Name: role, AttributeDataType: String, Mutable: true }
        - { Name: brandId, AttributeDataType: String, Mutable: true }
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: punarnava-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  GroupTechnician: { Type: AWS::Cognito::UserPoolGroup, Properties: { UserPoolId: !Ref UserPool, GroupName: technician, Description: Repair technicians } }
  GroupCollector: { Type: AWS::Cognito::UserPoolGroup, Properties: { UserPoolId: !Ref UserPool, GroupName: collector, Description: Kabadiwalas and collectors } }
  GroupRecycler: { Type: AWS::Cognito::UserPoolGroup, Properties: { UserPoolId: !Ref UserPool, GroupName: recycler, Description: Registered recyclers and refurbishers } }
  GroupBrand: { Type: AWS::Cognito::UserPoolGroup, Properties: { UserPoolId: !Ref UserPool, GroupName: brand, Description: Brand quality analysts } }
  GroupAdmin: { Type: AWS::Cognito::UserPoolGroup, Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Description: Platform admins } }

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth.preSignUp
      Description: Auto-confirm sign-ups and block self-assigned admin role

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/auth.postConfirmation
      Description: Add new users to their Cognito group and create their profile
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref PreSignUpFunction, Principal: cognito-idp.amazonaws.com, SourceArn: !GetAtt UserPool.Arn }
  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref PostConfirmationFunction, Principal: cognito-idp.amazonaws.com, SourceArn: !GetAtt UserPool.Arn }

  # ───────────── API ─────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Sub 'https://main.${AmplifyApp.DefaultDomain}', 'http://localhost:8080']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      # Per-route limits for the public speech routes (shared by all callers, not per IP; the app also counts per IP).
      # Each key needs a matching explicit event on ApiFunction below.
      RouteSettings:
        'POST /public/tts': { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
        'POST /public/owner/{jobId}/uploads': { ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5 }
        'POST /public/owner/{jobId}/stt': { ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5 }
      Auth:
        # /api/* uses this; /public/* events say Authorizer: NONE, which SAM only accepts when a default is set.
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/api.handler
      Description: All app actions (Repair Desk, owner link, Parts Exchange, Kabadi Connect, ReLife, insights, admin)
      MemorySize: 1024
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RepairStateMachine
          SEED_FN: !Ref SeedFunction
          ANOMALY_FN: !Ref AnomalyFunction
          USER_POOL_ID: !Ref UserPool
          SCHEDULED_FN_ARN: !GetAtt ScheduledFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SPEECH_ENABLED: !Ref EnableCloudSpeech
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        # Also covers speech: HeadObject/GetObject/PutObject on tts/*, Transcribe reading uploads/* as this role, deleting uploads/tmp/*.
        - S3CrudPolicy: { BucketName: !Ref PhotoBucket }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt RepairStateMachine.Name }
        - LambdaInvokePolicy: { FunctionName: !Ref SeedFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref AnomalyFunction }
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:SendTaskFailure]
              Resource: !Ref RepairStateMachine
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule]
              Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/pn-*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
            - Effect: Allow
              Action: [cognito-idp:AdminDisableUser, cognito-idp:AdminEnableUser]
              Resource: !GetAtt UserPool.Arn
            - !If
              - SpeechOn
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'
              - !Ref AWS::NoValue
            - !If
              - SpeechOn
              - Effect: Allow
                Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob, transcribe:DeleteTranscriptionJob]
                Resource: '*'
              - !Ref AWS::NoValue
      Events:
        Private:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: ANY, Auth: { Authorizer: CognitoJwt } }
        Public:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/public/{proxy+}', Method: ANY, Auth: { Authorizer: NONE } }
        # Explicit routes so HttpApi RouteSettings can throttle them; same function and router as {proxy+}.
        PublicTts:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /public/tts, Method: POST, Auth: { Authorizer: NONE } }
        OwnerClipUpload:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/public/owner/{jobId}/uploads', Method: POST, Auth: { Authorizer: NONE } }
        OwnerStt:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/public/owner/{jobId}/stt', Method: POST, Auth: { Authorizer: NONE } }

  # ───────────── Workflow ─────────────
  RepairStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: punarnava-repair-job
      Type: STANDARD
      DefinitionUri: statemachine/repair-job.asl.json
      DefinitionSubstitutions:
        WorkflowFunctionArn: !GetAtt WorkflowFunction.Arn
        OwnerTimeoutSeconds: !If [IsDemo, '900', '259200']
        RepairTimeoutSeconds: !If [IsDemo, '259200', '1209600']
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref WorkflowFunction }
      Tracing: { Enabled: true }

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/workflow.handler
      Description: Step Functions tasks for one repair job
      Environment:
        Variables:
          SCHEDULED_FN_ARN: !GetAtt ScheduledFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule]
              Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/pn-*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: invoke-scheduled
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt ScheduledFunction.Arn }]

  ScheduledFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.scheduled
      Description: EventBridge Scheduler target - owner reminders and 30-day follow-ups
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement: [{ Effect: Allow, Action: sns:Publish, Resource: '*' }]

  # ───────────── Events and queues ─────────────
  EventBus:
    Type: AWS::Events::EventBus
    Properties: { Name: punarnava-bus }

  AnalyticsDLQ: { Type: AWS::SQS::Queue, Properties: { MessageRetentionPeriod: 1209600 } }
  AnalyticsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy: { deadLetterTargetArn: !GetAtt AnalyticsDLQ.Arn, maxReceiveCount: 3 }
  PickupQueue:
    Type: AWS::SQS::Queue
    Properties: { VisibilityTimeout: 180 }

  AnalyticsRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern: { source: [punarnava] }
      Targets: [{ Arn: !GetAtt AnalyticsQueue.Arn, Id: analytics }]
  PickupRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern: { source: [punarnava], detail-type: [pickup.requested] }
      Targets: [{ Arn: !GetAtt PickupQueue.Arn, Id: pickups }]

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AnalyticsQueue, !Ref PickupQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: [!GetAtt AnalyticsQueue.Arn, !GetAtt PickupQueue.Arn]
            Condition: { ArnEquals: { 'aws:SourceArn': [!GetAtt AnalyticsRule.Arn, !GetAtt PickupRule.Arn] } }

  AggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.aggregator
      Description: Anonymised failure aggregates and impact counters
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Analytics:
          Type: SQS
          Properties: { Queue: !GetAtt AnalyticsQueue.Arn, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures] }

  PickupDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.pickupDispatcher
      Description: Notify collectors about new pickups in their area
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
      Events:
        Pickups:
          Type: SQS
          Properties: { Queue: !GetAtt PickupQueue.Arn, BatchSize: 5, FunctionResponseTypes: [ReportBatchItemFailures] }

  PartMatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.partMatcher
      Description: Alert technicians whose saved search matches a newly listed part
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
      Events:
        PartListed:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern: { source: [punarnava], detail-type: [part.listed] }

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: punarnava-alerts, DisplayName: Punarnava }
  AlertsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: { TopicArn: !Ref AlertsTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  # ───────────── Analytics ─────────────
  AnomalyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.anomaly
      Description: Nightly failure-spike detection (SageMaker RCF when configured, robust z-score otherwise)
      Timeout: 120
      Environment:
        Variables:
          SAGEMAKER_ENDPOINT: !Ref SageMakerEndpoint
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: sagemaker:InvokeEndpoint
              Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*'
      Events:
        Nightly:
          Type: Schedule
          Properties: { Schedule: 'cron(30 20 * * ? *)', Description: '02:00 IST nightly spike check' }

  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/async.seed
      Description: Load labelled synthetic repair data for the brand dashboard
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: punarnava
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Impact (real activity only)", "region": "${AWS::Region}", "stat": "Sum", "period": 86400, "view": "timeSeries",
                "metrics": [
                  ["Punarnava", "productsKeptInUse", "Service", "punarnava"],
                  [".", "partsReused", ".", "."],
                  [".", "partsHarvested", ".", "."],
                  [".", "repairsLogged", ".", "."]
                ] } },
            { "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Kilograms", "region": "${AWS::Region}", "stat": "Sum", "period": 86400,
                "metrics": [
                  ["Punarnava", "kgKeptInUse", "Service", "punarnava"],
                  [".", "kgPartsReused", ".", "."],
                  [".", "kgToRecycler", ".", "."]
                ] } },
            { "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}"],
                  ["...", "${WorkflowFunction}"],
                  ["...", "${AggregatorFunction}"]
                ] } },
            { "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Repair workflows", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${RepairStateMachine}"],
                  [".", "ExecutionsSucceeded", ".", "."],
                  [".", "ExecutionsTimedOut", ".", "."]
                ] } }
          ]
        }

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
  AppUrl:
    Value: !Sub 'https://main.${AmplifyApp.DefaultDomain}'
  PhotoBucket:
    Value: !Ref PhotoBucket
  TableName:
    Value: !Ref Table
  StateMachineArn:
    Value: !Ref RepairStateMachine
  CloudSpeech:
    Description: Written into config.js as cloudSpeech by scripts/deploy-frontend.sh
    Value: !If [SpeechOn, 'true', 'false']
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=punarnava'
